[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "whisperstt"
version = "0.1.0"
description = "Transcribe audio and video into SRT subtitles with faster-whisper"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.0",
    "numpy",
    "watchdog",
]

[project.scripts]
whisperstt = "whisperstt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
